name: 🚀 Deploy validpanel-cli

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Install deps & build
        run: |
          npm ci
          npm run build
          npm prune --production

      - name: 📦 Package release (dist + templates + package.json + lock + node_modules)
        run: |
          mkdir -p release
          cp -r dist release/
          cp package.json release/
          cp package-lock.json release/
          cp -r node_modules release/

      - name: 📤 Upload release bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          source: "release/*"
          target: "~/validpanel-cli"
          overwrite: true

      - name: 🧠 Install CLI globally on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          script: |
            cd ~/validpanel-cli
            npm install -g .
            echo "✅ validpanel-cli deployed and installed globally"
