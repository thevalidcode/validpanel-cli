name: 🚀 Deploy validpanel-cli

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-validpanel-cli
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Build CLI
        run: |
          npm ci
          npm run build
          npm prune --production

      - name: 📦 Prepare release bundle
        run: |
          rm -rf release
          mkdir -p release
          cp -r dist release/
          cp -r src/templates release/dist/
          cp package.json release/
          cp package-lock.json release/

      - name: 📤 Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          source: "release"
          target: "~/validpanel-cli"
          overwrite: true

      - name: 🧠 Install CLI globally on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          script: |
            set -e

            cd ~/validpanel-cli/release

            chmod +x dist/cli.js

            # Install all dependencies (production only, to keep it slim)
            npm ci --only=production

            # Clean old global install and reinstall
            sudo npm uninstall -g . || true
            sudo npm install -g .

            # Verify installation
            if command -v validpanel-cli >/dev/null 2>&1; then
              echo "✅ validpanel-cli deployed and installed globally"
            else
              echo "❌ validpanel-cli not found in PATH"
              exit 1
            fi