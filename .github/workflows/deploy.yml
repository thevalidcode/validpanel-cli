name: 🚀 Deploy validpanel-cli

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-validpanel-cli
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Build CLI
        run: |
          npm ci
          npm run build
          npm prune --production

      - name: 📦 Prepare release bundle
        run: |
          rm -rf release
          mkdir -p release
          cp -r dist release/
          cp package.json release/
          cp package-lock.json release/

      - name: 📤 Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          source: "release/*"
          target: "~/validpanel-cli"
          overwrite: true

      - name: 🧠 Install CLI globally on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          script: |
            set -e

            cd ~/validpanel-cli

            # Ensure user-local npm prefix is set
            if ! grep -q "prefix=" ~/.npmrc 2>/dev/null; then
              mkdir -p ~/.npm-global
              npm config set prefix ~/.npm-global
              echo 'export PATH=$HOME/.npm-global/bin:$PATH' >> ~/.bashrc
            fi

            # Clean old install and reinstall globally
            npm uninstall -g . || true
            npm install -g .

            which validpanel-cli || echo "⚠️ CLI not in PATH"
            echo "✅ validpanel-cli deployed and installed globally"
